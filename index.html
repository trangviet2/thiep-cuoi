<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#8a1423" />
<title>Thiệp mời đám cưới — Hoàng Việt &amp; Thu Trang</title>
<meta name="description" content="Trân trọng kính mời bạn đến dự đám cưới của Hoàng Việt &amp; Thu Trang — 13.12.2026." />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@500;600&family=Lora:wght@400;500&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px 22px calc(28px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(ellipse at 50% 38%, #fffdf8 0%, #f9efe2 45%, #efdccb 80%, #e2c4b4 100%); color: #3f372f; font: 17px/1.7 'Lora', Georgia, serif; text-align: center; }
  .card { width: min(420px, 100%); padding: 38px 24px 34px; border-radius: 18px; background: rgba(255, 255, 255, 0.75); border: 1px solid rgba(168, 32, 47, 0.4);
    box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.9), inset 0 0 0 6px rgba(184, 150, 90, 0.5), 0 14px 40px rgba(44, 38, 32, 0.14); }
  .xi { font-size: 2.6rem; line-height: 1; color: #b8965a; }
  .top { margin-top: 10px; font-size: 0.85rem; letter-spacing: 0.34em; text-transform: uppercase; color: #a8202f; font-weight: 500; }
  h1 { margin: 10px 0 4px; font-family: 'Cormorant Upright', Georgia, serif; font-weight: 600; font-size: clamp(2rem, 9vw, 2.6rem); line-height: 1.15; color: #7d1424; }
  h1 i { color: #b8965a; font-size: 0.8em; padding: 0 0.1em; }
  .date { margin-bottom: 26px; letter-spacing: 0.22em; color: #a8202f; font-weight: 500; }
  a.btn { display: block; margin-top: 14px; padding: 15px 18px; border-radius: 999px; text-decoration: none; font-weight: 500; font-size: 1.02rem; }
  a.btn.fill { background: linear-gradient(135deg, #b3222f, #85141f); color: #fff; box-shadow: 0 8px 20px rgba(133, 20, 31, 0.3); }
  a.btn.line { border: 1.5px solid #a8202f; color: #a8202f; }
  a.btn small { display: block; font-size: 0.82rem; opacity: 0.85; font-weight: 400; }
  a.btn:focus-visible { outline: 3px solid #b8965a; outline-offset: 3px; }
</style>
</head>
<body>
  <main class="card">
    <div class="xi" aria-hidden="true">囍</div>
    <p class="top">Thiệp mời đám cưới</p>
    <h1>Hoàng Việt <i>&amp;</i> Thu Trang</h1>
    <p class="date">13 . 12 . 2026</p>
    <a class="btn fill" id="lnkTrai" href="nha-trai.html">Lễ Thành Hôn · Nhà Trai<small>12:00 · Thôn Bắc An Bình, xã Bình Nguyên</small></a>
    <a class="btn line" id="lnkGai" href="nha-gai.html">Lễ Vu Quy · Nhà Gái<small>11:00 · Thôn Tri Lễ, xã Quang Lịch</small></a>
  </main>
  <script>
    // Giữ lại tên khách (?guest=...) khi chuyển sang thiệp
    (function () {
      var q = window.location.search;
      if (!q) return;
      ['lnkTrai', 'lnkGai'].forEach(function (id) {
        var a = document.getElementById(id);
        a.href = a.getAttribute('href') + q;
      });
    })();
  </script>
</body>
</html>
